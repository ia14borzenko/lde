# Сайт сервера LDE за nginx (замените lde.EXAMPLE на свой домен, например lde.203-0-113-10.sslip.io).
# Сертификат: certbot certonly --webroot -w /var/www/html -d lde.EXAMPLE
server {
    listen 80;
    listen [::]:80;
    server_name lde.EXAMPLE;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lde.EXAMPLE;

    ssl_certificate /etc/letsencrypt/live/lde.EXAMPLE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lde.EXAMPLE/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 300m;
    server_tokens off;
    access_log off;          # в путях бывают токены ссылок

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
